<style>
:root{
  --bg:#0a1120; --panel:#141e36; --panel2:#1b2846; --line:#2b3b60;
  --text:#eef2fb; --muted:#9aa8c7; --accent:#ffd23f; --ok:#2fbf71; --ko:#e5484d;
  --c0:#d9434b; --c1:#3d63d6; --c2:#d99a12; --c3:#25935a;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  font-family:Outfit,"Segoe UI",system-ui,sans-serif;color:var(--text);overflow:hidden;
  background:
    radial-gradient(1100px 650px at 85% -15%,#1c2e5a 0%,transparent 60%),
    radial-gradient(900px 600px at -10% 115%,#2b1f4a 0%,transparent 55%),
    var(--bg);
}
#app{height:100vh;display:flex;flex-direction:column}
button{font:inherit;cursor:pointer;color:inherit}
.hidden{display:none!important}

/* ---------- common ---------- */
.btn{border:0;border-radius:14px;padding:.7em 1.3em;font-weight:700;font-size:clamp(16px,1.4vw,22px);
  background:var(--panel2);border:1px solid var(--line);transition:transform .08s,filter .15s}
.btn:hover{filter:brightness(1.15)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:#1a1300;border-color:transparent;box-shadow:0 6px 0 #b8940f}
.btn.primary:active{box-shadow:0 2px 0 #b8940f;transform:translateY(4px)}
.btn.ghost{background:transparent}
.icon-btn{background:var(--panel);border:1px solid var(--line);border-radius:10px;width:42px;height:42px;font-size:18px;display:grid;place-items:center}
.icon-btn:hover{background:var(--panel2)}
.chip{display:inline-flex;align-items:center;gap:.4em;padding:.35em .8em;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-weight:600;font-size:clamp(13px,1.05vw,17px);white-space:nowrap}
.chip.type{background:rgba(255,210,63,.12);border-color:rgba(255,210,63,.4);color:var(--accent)}

/* ---------- setup ---------- */
.setup{flex:1;display:grid;grid-template-columns:1.05fr 1fr;gap:3vw;padding:4vh 4vw;overflow:auto}
.hero{display:flex;flex-direction:column;justify-content:center;gap:2.2vh}
.logo{font-size:clamp(40px,5.2vw,86px);font-weight:800;line-height:1;letter-spacing:-.02em}
.logo .bolt{color:var(--accent)}
.logo small{display:block;font-size:.32em;font-weight:500;color:var(--muted);letter-spacing:0;margin-top:.6em}
.chainDemo{display:flex;flex-wrap:wrap;align-items:center;gap:.5em;font-size:clamp(14px,1.2vw,19px)}
.chainDemo .e{padding:.45em .8em;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-weight:600}
.chainDemo .arr{color:var(--muted)}
.typesList{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.6em;max-width:640px}
.typesList div{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:12px;padding:.55em .8em;font-size:clamp(13px,1.05vw,17px);color:#d5ddf0}
.card{background:rgba(20,30,54,.85);border:1px solid var(--line);border-radius:22px;padding:2.4vh 2vw;display:flex;flex-direction:column;gap:2.2vh;align-self:center;backdrop-filter:blur(6px)}
.card h3{margin:0 0 .6em;font-size:clamp(14px,1.05vw,17px);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.row{display:flex;align-items:center;gap:.6em;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{border:0;background:transparent;padding:.45em 1em;border-radius:9px;font-weight:600;font-size:clamp(14px,1.1vw,18px);color:var(--muted)}
.seg button.on{background:var(--panel2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
.teamsEdit{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.5em}
.teamsEdit label{display:flex;align-items:center;gap:.5em;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:.25em .6em}
.teamsEdit .dot{width:14px;height:14px;border-radius:50%;flex:none}
.teamsEdit input{flex:1;min-width:0;background:transparent;border:0;color:var(--text);font:inherit;font-size:clamp(14px,1.1vw,18px);padding:.35em 0;outline:none}
.toggles{display:flex;flex-wrap:wrap;gap:.45em}
.toggles button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:.4em .85em;font-weight:600;font-size:clamp(13px,1.05vw,17px);color:var(--muted)}
.toggles button.on{background:var(--panel2);color:var(--text);border-color:#4a5f92}
.avail{color:var(--muted);font-size:clamp(13px,1vw,16px)}
.startRow{display:flex;justify-content:space-between;align-items:center;gap:1em}

/* ---------- game ---------- */
.top{display:flex;align-items:center;gap:.7em;padding:1.4vh 2vw;flex-wrap:wrap}
.top .mini{font-weight:800;font-size:clamp(16px,1.4vw,22px);margin-right:.4em}
.top .mini .bolt{color:var(--accent)}
.top .spacer{flex:1}
.timerbar{height:8px;background:rgba(255,255,255,.06);margin:0 2vw;border-radius:99px;overflow:hidden}
.timerbar .fill{height:100%;width:100%;background:linear-gradient(90deg,var(--accent),#ff9f1c);transform-origin:left;transition:transform .1s linear}
.timerbar.low .fill{background:linear-gradient(90deg,#ff6b6b,var(--ko))}
.stage{flex:1;display:flex;flex-direction:column;gap:2.2vh;padding:2.2vh 3vw 1vh;min-height:0;overflow-y:auto}
.stage.revealed{gap:1.6vh}
.stage.revealed .tiles{max-height:42vh}
.stage.revealed .tiles.one .tile{padding:1vh 1.2vw}
.stage.revealed .chain{margin-bottom:1.6vh}
.explain{flex:none}
.qhead{display:flex;align-items:center;gap:2vw}
.qtext{flex:1;font-size:clamp(22px,2.5vw,44px);font-weight:700;line-height:1.2;text-wrap:balance}
.clock{flex:none;width:clamp(70px,7vw,118px);height:clamp(70px,7vw,118px);border-radius:50%;display:grid;place-items:center;
  font-size:clamp(26px,2.9vw,50px);font-weight:800;background:var(--panel);border:3px solid var(--accent);font-variant-numeric:tabular-nums}
.clock.low{border-color:var(--ko);color:#ff8a8a}
.clock.off{font-size:clamp(14px,1.2vw,20px);border-color:var(--line);color:var(--muted);text-align:center;line-height:1.1}
.answers{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center}

/* tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:1.6vh 1.2vw;height:100%;max-height:52vh}
.tiles.one{grid-template-columns:1fr}
.tiles.vf{max-height:34vh}
.tile{position:relative;border-radius:16px;display:flex;align-items:center;gap:1vw;padding:1.4vh 1.4vw;color:#fff;
  font-size:clamp(17px,1.75vw,31px);font-weight:600;line-height:1.2;box-shadow:0 6px 0 rgba(0,0,0,.28);transition:opacity .3s,transform .3s,filter .3s}
.tiles.one .tile{font-size:clamp(15px,1.45vw,25px);font-weight:500}
.tile .shape{font-weight:800;flex:none;width:clamp(34px,3vw,54px);height:clamp(34px,3vw,54px);display:grid;place-items:center;font-size:clamp(20px,1.9vw,34px);background:rgba(0,0,0,.18);border-radius:10px}
.tile.k0{background:var(--c0)}.tile.k1{background:var(--c1)}.tile.k2{background:var(--c2)}.tile.k3{background:var(--c3)}
.tile .mark{margin-left:auto;font-size:1.3em;opacity:0}
.revealed .tile.dim{opacity:.28;filter:grayscale(.6)}
.revealed .tile.correct{transform:scale(1.02);box-shadow:0 0 0 4px #fff,0 8px 24px rgba(0,0,0,.4)}
.revealed .tile.correct .mark{opacity:1}

/* energy chain */
.chain{display:flex;align-items:stretch;justify-content:center;gap:.6vw;margin-bottom:3vh;flex-wrap:wrap}
.ebox{min-width:clamp(110px,11vw,190px);padding:1.2vh 1vw;border-radius:16px;background:var(--panel);border:2px solid var(--line);text-align:center}
.ebox .em{font-size:clamp(26px,2.6vw,46px)}
.ebox .en{font-weight:800;font-size:clamp(16px,1.5vw,26px)}
.ebox .es{color:var(--muted);font-size:clamp(12px,.95vw,16px);margin-top:.2em}
.ebox.blank{border-style:dashed;border-color:var(--accent);background:rgba(255,210,63,.07)}
.ebox.blank .en{color:var(--accent)}
.ebox.filled{border-style:solid;border-color:var(--ok);background:rgba(47,191,113,.12)}
.carr{align-self:center;font-size:clamp(20px,2vw,34px);color:var(--muted)}

/* order */
.orderList{display:grid;grid-template-columns:1fr 1fr;gap:1.4vh 1.2vw}
.oitem{display:flex;align-items:center;gap:1vw;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:1.3vh 1.1vw;font-size:clamp(15px,1.4vw,24px);line-height:1.25}
.badge{flex:none;min-width:clamp(32px,2.6vw,46px);height:clamp(32px,2.6vw,46px);border-radius:10px;display:grid;place-items:center;font-weight:800;background:var(--panel2);border:1px solid #4a5f92;font-size:clamp(15px,1.4vw,24px)}
.badge.step{background:var(--ok);border-color:transparent;color:#05210f}
.orderList.solved .oitem{border-color:rgba(47,191,113,.6);background:rgba(47,191,113,.08)}
.solution{margin-top:1.6vh;text-align:center;font-weight:800;font-size:clamp(18px,1.8vw,30px);color:var(--accent);letter-spacing:.03em}
.howto{text-align:center;color:var(--muted);font-size:clamp(13px,1.05vw,17px);margin-top:1.2vh}

/* match */
.match{display:grid;grid-template-columns:1fr 1fr;gap:1.4vh 3vw}
.mcol{display:flex;flex-direction:column;gap:1.2vh}
.mitem{display:flex;align-items:center;gap:1vw;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:1.1vh 1vw;font-size:clamp(15px,1.4vw,24px);line-height:1.2;min-height:7vh}
.mitem .badge.num{background:#2a2350;border-color:#6b5bd6}
.pairs{display:flex;flex-direction:column;gap:1.1vh}
.pair{display:grid;grid-template-columns:1fr auto 1.3fr;align-items:center;gap:1vw}
.pair .mitem{min-height:0}
.pair .lnk{font-size:clamp(18px,1.6vw,28px);color:var(--ok)}
.pair .mitem.r{border-color:rgba(47,191,113,.6);background:rgba(47,191,113,.08)}

/* error */
.errSentence{font-size:clamp(22px,2.4vw,42px);line-height:2.1;text-align:center;font-weight:500;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:3vh 3vw;max-width:1400px;margin:0 auto}
.cand{position:relative;display:inline-block;padding:0;border-bottom:4px solid var(--accent);font-weight:700;line-height:1.3}
.cand sup{position:absolute;top:-1.05em;left:50%;transform:translateX(-50%);font-size:.48em;background:var(--accent);color:#1a1300;border-radius:6px;padding:.05em .4em;font-weight:800;line-height:1.4}
.revealed .cand.okw{border-bottom-color:rgba(255,255,255,.2)}
.revealed .cand.okw sup{background:var(--panel2);color:var(--muted)}
.cand.bad .w{text-decoration:line-through;text-decoration-thickness:3px;color:#ff8a8a}
.cand.bad{border-bottom-color:var(--ko)}
.cand.bad sup{background:var(--ko);color:#fff}
.cand .fix{color:#5fe39b;margin-left:.3em}

/* explanation */
.explain{background:linear-gradient(90deg,rgba(47,191,113,.16),rgba(47,191,113,.05));border:1px solid rgba(47,191,113,.5);border-radius:16px;padding:1.4vh 1.4vw;font-size:clamp(15px,1.35vw,23px);line-height:1.35;animation:pop .35s ease}
.explain b{color:#7ff0b0}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* bottom bar */
.bottom{display:flex;align-items:center;gap:1.2vw;padding:1.4vh 2vw 2vh;border-top:1px solid rgba(255,255,255,.06);background:rgba(5,9,18,.45)}
.teamBar{flex:1;display:flex;flex-direction:column;gap:.6vh;min-width:0}
.hint{color:var(--muted);font-size:clamp(12px,.95vw,15px)}
.teamChips{display:flex;gap:.6vw;flex-wrap:wrap}
.tchip{display:flex;align-items:center;gap:.5em;border-radius:12px;padding:.45em .8em;background:var(--panel);border:2px solid var(--line);font-weight:700;font-size:clamp(14px,1.15vw,19px);transition:background .15s,border-color .15s}
.tchip .dot{width:12px;height:12px;border-radius:50%}
.tchip .k{font-size:.75em;color:var(--muted);font-weight:600}
.tchip .st{font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.tchip.locked{border-color:var(--accent);background:rgba(255,210,63,.1)}
.tchip.locked .st{color:var(--accent)}
.tchip.ok{border-color:var(--ok);background:rgba(47,191,113,.18)}
.tchip.ok .st{color:#7ff0b0}
.tchip.ko .st{color:#ff8a8a}

/* scoreboard */
.board{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.4vh;padding:3vh 6vw}
.board h2{margin:0;font-size:clamp(28px,3vw,52px);font-weight:800}
.board .sub{color:var(--muted);font-size:clamp(14px,1.2vw,20px);margin-top:-1.4vh}
.ranks{width:min(1100px,100%);display:flex;flex-direction:column;gap:1.2vh}
.rank{display:grid;grid-template-columns:3em 1fr auto;align-items:center;gap:1vw;font-size:clamp(16px,1.6vw,28px);font-weight:700}
.rank .pos{color:var(--muted);text-align:right}
.rank .barw{position:relative;height:clamp(40px,5.2vh,62px);background:rgba(255,255,255,.04);border-radius:12px;overflow:hidden}
.rank .bar{position:absolute;inset:0 auto 0 0;border-radius:12px;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.rank .lbl{position:absolute;inset:0;display:flex;align-items:center;gap:.6em;padding:0 1em;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.rank .lbl .streak{font-size:.75em;font-weight:600}
.rank .pts{font-variant-numeric:tabular-nums;min-width:4.5em;text-align:right}
.rank .delta{font-size:.7em;color:#7ff0b0;display:block;text-align:right;font-weight:600}

/* final */
.podium{display:flex;align-items:flex-end;justify-content:center;gap:1.5vw;margin-top:2vh}
.pod{display:flex;flex-direction:column;align-items:center;gap:.8vh;width:clamp(150px,15vw,260px)}
.pod .name{font-weight:800;font-size:clamp(18px,1.8vw,32px);text-align:center}
.pod .pp{color:var(--muted);font-weight:600;font-size:clamp(14px,1.2vw,20px)}
.pod .blk{width:100%;border-radius:16px 16px 0 0;display:grid;place-items:start center;padding-top:1.5vh;font-size:clamp(34px,3.6vw,64px);font-weight:800;animation:rise .8s cubic-bezier(.2,.8,.2,1) both}
.pod.p1 .blk{height:30vh;background:linear-gradient(#ffd23f,#c99a00);color:#3a2b00}
.pod.p2 .blk{height:22vh;background:linear-gradient(#cfd8e8,#8d9ab3);color:#1d2433;animation-delay:.25s}
.pod.p3 .blk{height:16vh;background:linear-gradient(#e0a172,#a5643a);color:#2d1608;animation-delay:.5s}
@keyframes rise{from{transform:scaleY(0);transform-origin:bottom}to{transform:scaleY(1);transform-origin:bottom}}
.rest{color:var(--muted);font-size:clamp(14px,1.2vw,20px);text-align:center}
.finalBtns{display:flex;gap:1em}

/* ---------- assignar equips a opcions (mode projectat) ---------- */
.tile.pick{cursor:pointer}
.tile.pick:hover{filter:brightness(1.12)}
.tile.active{box-shadow:0 0 0 5px #fff,0 8px 24px rgba(0,0,0,.45);transform:scale(1.02)}
.tdots{margin-left:auto;display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.tdots:empty{display:none}
.tdots+.mark{margin-left:.4em}
.tdot{width:1.7em;height:1.7em;border-radius:50%;display:grid;place-items:center;font-size:.8em;font-weight:800;color:#0a1120;border:2px solid #fff}
.tiles.errOpts{max-height:22vh;margin-top:2.4vh}
.tiles.errOpts .tile{font-size:clamp(16px,1.5vw,26px)}

/* ---------- mode grup ---------- */
.btn:disabled{opacity:.4;cursor:not-allowed;filter:none;transform:none}
.playSeg{display:flex}
.playSeg button{flex:1}
.rules{margin:0;padding-left:1.2em;color:#d5ddf0;font-size:clamp(13px,1.05vw,17px);line-height:1.5}
.turn{display:flex;align-items:center;gap:.6em;flex-wrap:wrap;padding:1vh 1.2vw;border-radius:16px;
  background:color-mix(in srgb,var(--pc) 16%,transparent);border:2px solid var(--pc);font-size:clamp(17px,1.6vw,28px);font-weight:600}
.turn b{color:var(--pc)}
.turn .pv{color:var(--muted);font-size:.8em}
.turn .spacer{flex:1}
.gbar{display:inline-block;width:clamp(80px,9vw,160px);height:10px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;vertical-align:middle}
.gbar span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#ff9f1c);transform-origin:left;transition:transform .2s linear}
.turn .btn{font-size:clamp(14px,1.15vw,19px);padding:.45em 1em}
button.tile{border:0;text-align:left}
button.tile:hover:not(:disabled){filter:brightness(1.12);transform:translateY(-2px)}
button.tile:disabled{cursor:default}
.tile.wrong{opacity:.35;filter:grayscale(.7)}
.tile.wrong .mark{opacity:1}
button.oitem,button.mitem{font:inherit;color:inherit;text-align:left;width:100%}

<script>
/* ============================================================
   ENERGIA EN CADENA · banc de preguntes
   Tipus: quiz | vf | expl | error | match | order | intrus | cadena
   - quiz / intrus / expl: opts[0] és SEMPRE la correcta (es barregen en jugar)
   - vf: a = true/false
   - cadena: chain (null = buit), a = energia correcta, opts = 4 energies
   - match: pairs [[esquerra, dreta], ...]
   - order: items en l'ordre correcte (es barregen en jugar)
   - error: [paraula] = candidata correcta · [paraula>correcció] = l'error
   ============================================================ */
/*BANC-INICI*/
const BANC = [
/* ---------------- GENERAL ---------------- */
{c:"general",t:"order",q:"Ordena l'esquema comú de les centrals amb turbina, des de l'inici fins a casa.",
 items:["Font d'energia (aigua, vent, Sol, combustible, urani)","Turbina: la mou el fluid","Alternador: genera l'electricitat","Transformador: puja la tensió","Xarxa elèctrica: distribueix l'electricitat"],
 exp:"Gairebé totes les centrals segueixen el mateix camí: <b>font → turbina → alternador → transformador → xarxa</b>. L'única excepció és la fotovoltaica, que no té turbina."},
{c:"general",t:"quiz",q:"Quin component transforma l'energia mecànica de rotació en energia elèctrica?",
 opts:["L'alternador","La turbina","El transformador","El condensador"],
 exp:"L'<b>alternador</b> està unit a l'eix de la turbina: quan gira, genera electricitat. La turbina només produeix el moviment."},
{c:"general",t:"expl",q:"Per què es puja la tensió de l'electricitat abans de transportar-la?",
 opts:["Perquè així es perd menys energia pel camí fins als llocs de consum.","Perquè l'electricitat arribi més ràpid a les cases.","Perquè els endolls de casa necessiten una tensió molt alta.","Perquè el corrent altern es converteixi en corrent continu."],
 exp:"El <b>transformador</b> puja la tensió perquè, transportant-la a alta tensió, <b>es perd menys energia</b> per les línies."},
{c:"general",t:"intrus",q:"Quina d'aquestes centrals és l'intrús perquè NO fa servir cap turbina?",
 opts:["Fotovoltaica","Nuclear","Hidroelèctrica","Termosolar"],
 exp:"A la <b>fotovoltaica</b> les cèl·lules de silici transformen directament la llum en electricitat: no hi ha turbina ni alternador."},
{c:"general",t:"match",q:"Relaciona cada central amb el que fa girar la seva turbina.",
 pairs:[["💧 Hidroelèctrica","L'aigua que cau"],["🌬️ Parc eòlic","El vent"],["⚛️ Nuclear","El vapor d'aigua"],["☀️ Fotovoltaica","Res: no té turbina"]],
 exp:"La turbina la mou un <b>fluid</b>: aigua, vent o vapor. A la fotovoltaica no n'hi ha."},
{c:"general",t:"match",q:"Relaciona cada central amb l'energia amb què COMENÇA la seva cadena.",
 pairs:[["💧 Hidroelèctrica","Energia potencial"],["🌬️ Parc eòlic","Energia cinètica"],["🔥 Tèrmica","Energia química"],["⚛️ Nuclear","Energia nuclear"],["🔆 Termosolar","Energia radiant"]],
 exp:"Cada central comença amb una energia diferent, però totes acaben amb <b>energia elèctrica</b>."},
{c:"general",t:"vf",q:"Una central elèctrica crea energia nova a partir del no-res.",a:false,
 exp:"<b>Fals.</b> Les centrals no creen energia: la <b>transformen</b> d'un tipus a un altre. Pel camí, una part es perd en forma de calor."},
{c:"general",t:"vf",q:"Si una central és renovable, vol dir que no té cap impacte ambiental.",a:false,
 exp:"<b>Fals.</b> Les renovables no emeten CO₂ en funcionar, però sí que tenen impacte: ocupen terreny, canvien el paisatge, afecten aus o peixos, necessiten energia i materials per fabricar-les i generen residus al final de la seva vida."},
{c:"general",t:"expl",q:"Què vol dir que una font d'energia és renovable?",
 opts:["Que es renova de manera natural i no s'esgota encara que la fem servir.","Que no contamina gens ni té cap impacte ambiental.","Que és la més barata i la que produeix més electricitat.","Que pot produir electricitat de dia i de nit sense parar."],
 exp:"Renovable vol dir que <b>no s'esgota</b>: l'aigua, el vent i el Sol es renoven sols. Que sigui renovable no vol dir que no tingui impacte."},
{c:"general",t:"quiz",q:"Quina d'aquestes centrals emet CO₂ quan funciona?",
 opts:["Tèrmica","Nuclear","Hidroelèctrica","Termosolar"],
 exp:"La <b>tèrmica</b> crema combustibles fòssils i emet CO₂. La nuclear no en emet en funcionar, però genera residus radioactius."},
{c:"general",t:"quiz",q:"Quina d'aquestes centrals NO és renovable?",
 opts:["Nuclear","Termosolar","Parc eòlic","Hidroelèctrica"],
 exp:"La <b>nuclear</b> fa servir urani, un recurs limitat. No emet CO₂ en funcionar, però no és renovable."},
{c:"general",t:"intrus",q:"Quina d'aquestes centrals és l'intrús perquè NO fa servir vapor d'aigua per moure la turbina?",
 opts:["Hidroelèctrica","Nuclear","Tèrmica","Termosolar"],
 exp:"A la nuclear, la tèrmica i la termosolar el <b>vapor</b> mou la turbina. A la <b>hidroelèctrica</b> la mou l'aigua que cau."},
{c:"general",t:"vf",q:"La nuclear, la tèrmica i la termosolar funcionen igual a partir del moment en què tenen vapor: el vapor mou la turbina i l'alternador produeix electricitat.",a:true,
 exp:"<b>Vertader.</b> Només canvia com s'aconsegueix la calor (fissió, combustió o Sol). A partir del vapor, el camí és el mateix."},
{c:"general",t:"vf",q:"De les sis centrals, la fotovoltaica és l'única que no necessita turbina ni alternador.",a:true,

{c:"hidro",t:"cadena",q:"Amb quina energia COMENÇA la cadena de la central hidroelèctrica?",

{c:"hidro",t:"order",q:"Ordena com funciona una central hidroelèctrica.",

{c:"hidro",t:"error",q:"Una d'aquestes paraules és un error. Quina?",

{c:"ts",t:"order",q:"Ordena com funciona una central termosolar.",

{c:"ts",t:"vf",q:"Una central termosolar amb sals foses pot produir electricitat de nit.",a:true,

{c:"ts",t:"expl",q:"Per què una central termosolar pot funcionar quan no hi ha Sol?",

{c:"ts",t:"match",q:"Relaciona cada part de la central termosolar amb la seva funció.",

 exp:"Concentrar la llum → escalfar → guardar → fer vapor → condensar perquè el cicle es repeteixi."},
{c:"ts",t:"error",q:"Una d'aquestes paraules és un error. Quina?",

{c:"ts",t:"quiz",q:"Per què una central termosolar pot afectar les aus?",

{c:"ts",t:"quiz",q:"Quina mesura redueix molt l'aigua que gasta una central termosolar?",

{c:"ts",t:"intrus",q:"Quin d'aquests NO és un inconvenient de la central termosolar?",

{c:"ts",t:"vf",q:"La sal fosa és totalment inofensiva: si es vessés no tindria cap efecte.",a:false,

/* ---------------- TÈRMICA ---------------- */
{c:"termica",t:"cadena",q:"Completa la cadena d'energia de la central tèrmica.",

{c:"termica",t:"cadena",q:"Completa la cadena d'energia de la central tèrmica.",

{c:"termica",t:"error",q:"Una d'aquestes paraules és un error. Quina?",

{c:"termica",t:"error",q:"Una d'aquestes paraules és un error. Quina?",

{c:"termica",t:"order",q:"Ordena com funciona una central tèrmica.",

{c:"termica",t:"quiz",q:"Quina funció té el condensador d'una central tèrmica?",

{c:"termica",t:"quiz",q:"Per què la xemeneia d'una central tèrmica és tan alta?",

{c:"termica",t:"vf",q:"A la central tèrmica, l'aigua que es converteix en vapor no es llença: el condensador la torna líquida i torna a la caldera.",a:true,

{c:"termica",t:"expl",q:"Per què la central tèrmica contribueix al canvi climàtic?",

{c:"termica",t:"match",q:"Relaciona cada impacte de la central tèrmica amb la seva explicació.",

{c:"termica",t:"error",q:"Una d'aquestes paraules és un error. Quina?",

{c:"termica",t:"quiz",q:"Quin és un avantatge de la central tèrmica?",

{c:"termica",t:"vf",q:"La central tèrmica és sostenible perquè el gas natural es renova ràpidament.",a:false,

{c:"termica",t:"intrus",q:"Quina d'aquestes NO és una mesura per reduir l'impacte de la central tèrmica?",

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function shuffleNotIdentity(a){ if(a.length<2) return [...a]; let s; do{ s=shuffle(a);}while(s.every((x,i)=>x===a[i])); return s; }
const teams = () => cfg.names.slice(0,cfg.nTeams).map((n,i)=>({name:(n||"").trim()||`Equip ${i+1}`,color:TEAM_COLORS[i]}));

function availableQs(){ return cfg.mode==="mix" ? [...BANC] : BANC.filter(q=>cfg.centrals.has(q.c)); }

/* Prepara una pregunta per jugar: barreja opcions i calcula la solució */
function prep(q){
  const p = {...q};
  if(["quiz","intrus","expl"].includes(q.t)){
    const idx = shuffle(q.opts.map((_,i)=>i));
    p.view = idx.map(i=>q.opts[i]);
    p.correct = idx.indexOf(0);
  } else if(q.t==="cadena"){
    p.view = shuffle(q.opts);
    p.correct = p.view.indexOf(q.a);
  } else if(q.t==="vf"){
    p.view = ["Vertader","Fals"];
    p.correct = q.a ? 0 : 1;
  } else if(q.t==="order"){
    p.view = shuffleNotIdentity(q.items);          // ordre mostrat (A, B, C…)
    p.solution = q.items.map(it=>LETTERS[p.view.indexOf(it)]);
  } else if(q.t==="match"){
    p.right = shuffleNotIdentity(q.pairs.map(x=>x[1]));
    p.solution = q.pairs.map((x,i)=>LETTERS[i]+(p.right.indexOf(x[1])+1));
  } else if(q.t==="error"){
    const segs=[]; let last=0, k=0;
    q.text.replace(/\[([^\]>]+)(?:>([^\]]+))?\]/g,(m,w,fix,off)=>{
      segs.push({txt:q.text.slice(last,off)});
      segs.push({w,fix,letter:LETTERS[k++]});
      last = off+m.length; return m;
    });
    segs.push({txt:q.text.slice(last)});
    p.segs = segs;
    p.correctLetter = segs.find(s=>s.fix)?.letter;
    const cands = segs.filter(s=>s.w!==undefined);   // paraules candidates, com a opcions A-D
    p.view = cands.map(s=>s.w);
    p.correct = cands.findIndex(s=>s.fix);
  }
  return p;
}

/* Tria equilibrada: es va passant per les centrals per torns i, dins de cada
   central, s'agafa la pregunta del tipus de joc que ha sortit menys vegades. */
function pickBalanced(pool,n){
  const byC = {};
  shuffle(pool).forEach(q=>(byC[q.c] ??= []).push(q));
  const typeCount = {}, out = [];
  let cs = shuffle(Object.keys(byC));
  while(out.length<n && cs.some(c=>byC[c].length)){
    for(const c of cs){
      if(out.length>=n) break;
      const arr = byC[c]; if(!arr.length) continue;
      arr.sort((a,b)=>(typeCount[a.t]||0)-(typeCount[b.t]||0));
      const q = arr.shift();
      typeCount[q.t] = (typeCount[q.t]||0)+1;
      out.push(q);
    }
    cs = shuffle(cs);
  }
  return out;
}

/* Tria N preguntes equilibrades i les ordena sense repetir tipus ni central seguides */
function pickQuestions(n){
  let pool = pickBalanced(availableQs(), n);
  const out=[];
  while(pool.length){
    const prev = out[out.length-1];
    let i = pool.findIndex(q=>!prev || (q.t!==prev.t && q.c!==prev.c));
    if(i<0) i = pool.findIndex(q=>!prev || q.t!==prev.t);
    if(i<0) i = 0;
    out.push(pool.splice(i,1)[0]);
  }
  return out.map(prep);
}

   PARTIDA
   ============================================================ */
function startGame(){
  const T = teams();
  G = {
    teams:T,
    qs:pickQuestions(cfg.len),
    i:0,
    scores:T.map(()=>0),
    prevRank:T.map((_,i)=>i),
    streak:T.map(()=>0),
    hits:T.map(()=>0),
    phase:"question"
  };
  startQuestion();
}

function startQuestion(){
  const q = G.qs[G.i];
  G.phase = "question";
  G.locks = {};      // equip -> fracció de temps restant quan ha respost
  G.marks = {};      // equip -> encertat (true)
  G.choice = {};     // equip -> opció que ha dit (preguntes amb opcions)
  G.active = null;   // opció que el professor/a està assignant ara
  G.dur = TYPES[q.t].t * timerMult() * 1000;
  G.elapsed = 0;
  G.paused = false;
  renderQuestion();
  if(cfg.timer!=="off") startTick();
}

function startTick(){
  stopTick();
  let last = performance.now();
  tick = setInterval(()=>{
    const now = performance.now();
    if(!G.paused) G.elapsed += now-last;
    last = now;
    updateClock();
    if(G.elapsed >= G.dur){ G.elapsed=G.dur; updateClock(); reveal(); }
  },100);
}
function stopTick(){ if(tick){clearInterval(tick);tick=null;} }
const remainingFrac = () => cfg.timer==="off" ? 1 : Math.max(0,1-G.elapsed/G.dur);

function updateClock(){
  const c=$("#clock"), f=$("#tfill"), bar=$("#tbar");
  if(!c||cfg.timer==="off") return;
  const rem = Math.max(0,(G.dur-G.elapsed)/1000);
  c.textContent = G.paused ? "⏸" : Math.ceil(rem);
  const low = rem<=5;
  c.classList.toggle("low",low); bar.classList.toggle("low",low);
  f.style.transform = `scaleX(${remainingFrac()})`;
}

/* ---------- render pregunta ---------- */
function renderQuestion(){
  const q = G.qs[G.i], ty = TYPES[q.t], ce = CENTRALS[q.c];
  const rev = G.phase==="reveal";
  $("#app").innerHTML = `
    <div class="top">
      <span class="mini"><span class="bolt">⚡</span> Energia en Cadena</span>
      <span class="chip">Pregunta ${G.i+1} / ${G.qs.length}</span>
      <span class="chip">${ce.e} ${ce.n==="Totes (comparar)"?"Totes les centrals":ce.n}</span>
      <span class="chip type">${ty.e} ${ty.n}</span>
      <span class="spacer"></span>
      ${cfg.timer!=="off" && !rev ? `<button class="icon-btn" id="btnPause" title="Pausa (P)">${G.paused?"▶":"⏸"}</button>`:""}
      <button class="icon-btn" id="btnSkip" title="Saltar pregunta">⏭</button>
      <button class="icon-btn" id="btnFull" title="Posa o treu la pantalla completa (F)" aria-label="Pantalla completa"><span class="fsIn">⛶</span><span class="fsOut">🗗</span></button>
      <button class="icon-btn" id="btnExit" title="Sortir">✕</button>
    </div>
    <div class="timerbar ${cfg.timer==="off"?"hidden":""}" id="tbar"><div class="fill" id="tfill"></div></div>
    <div class="stage ${rev?"revealed":""}">
      <div class="qhead">
        <div class="qtext">${q.q}</div>
        <div class="clock ${cfg.timer==="off"?"off":""}" id="clock">${cfg.timer==="off"?"sense<br>temps":""}</div>
      </div>
      <div class="answers">${renderAnswers(q,rev)}</div>
      ${rev?`<div class="revealInfo"><div class="explain">💡 ${q.exp}</div>${photoHtml(q)}</div>`:""}
    </div>
    <div class="bottom">
      <div class="teamBar">
        <div class="hint">${classeHint(q,rev)}</div>
        <div class="teamChips">${G.teams.map((t,i)=>teamChip(t,i,rev)).join("")}</div>
      </div>
      <button class="btn primary" id="btnMain">${!rev ? "Mostrar resposta ▶"
        : cfg.board==="each" ? "Puntuar ▶"
        : G.i===G.qs.length-1 ? "Puntuar i veure resultats 🏆" : "Puntuar i següent ▶"}</button>
    </div>`;
  if(rev && cfg.timer!=="off"){ $("#tfill").style.transform=`scaleX(${G.revealFrac})`; $("#clock").textContent="✓"; }
  else updateClock();

  document.querySelectorAll(".tchip").forEach(b=>b.onclick=()=>teamAction(+b.dataset.i));
  if(!rev) document.querySelectorAll("[data-opt]").forEach(el=>el.onclick=()=>pickOpt(+el.dataset.opt));
  $("#btnMain").onclick = mainAction;
  $("#btnSkip").onclick = ()=>{ if(confirm("Vols saltar aquesta pregunta sense puntuar?")){ stopTick(); nextQuestion(); } };
  $("#btnFull").onclick = toggleFull;
  $("#btnExit").onclick = ()=>{ if(confirm("Vols sortir de la partida? Es perdrà la puntuació.")) renderSetup(); };
  const bp=$("#btnPause"); if(bp) bp.onclick=togglePause;
  fitStage();
}

/* Ajusta la zona de pregunta a la pantalla: si no hi cap, la redueix amb zoom
   (fins al 60 %). Així el joc s'adapta a l'ordinador i a qualsevol projector. */
function fitSetup(){
  const s = document.querySelector(".setup"); if(!s || innerWidth<=900) return;   // al mòbil, es fa scroll
  let z = 1; s.style.zoom = 1;
  while(s.scrollHeight > s.clientHeight+1 && z > 0.75){
    z = Math.round((z-0.03)*100)/100;
    s.style.zoom = z;
  }
}
function fitStage(){
  fitSetup();
  const s = document.querySelector(".stage"); if(!s || !s.lastElementChild) return;
  let z = 1; s.style.zoom = 1;
  s.classList.add("measuring");               // el bloc de respostes ocupa només el que necessita
  const fits = ()=> s.lastElementChild.getBoundingClientRect().bottom <= s.getBoundingClientRect().bottom + 1;
  while(!fits() && z > 0.6){
    z = Math.round((z-0.04)*100)/100;
    s.style.zoom = z;
  }
  s.classList.remove("measuring");
}
let fitT = null;
window.addEventListener("resize", ()=>{ clearTimeout(fitT); fitT = setTimeout(fitStage,120); });
document.addEventListener("fullscreenchange", ()=>setTimeout(fitStage,150));

/* Preguntes amb opcions: el professor/a assigna cada equip a l'opció que diu i el joc corregeix sol.
   Ordena i Relaciona: el professor/a marca qui encerta després de mostrar la resposta. */
const ASSIGN = ["quiz","intrus","expl","cadena","vf","error"];
const assignable = q => ASSIGN.includes(q.t);
function optLabel(q,i){
  if(q.t==="vf") return i===0 ? "✔ Vertader" : "✘ Fals";
  if(q.t==="error") return LETTERS[i];
  return SHAPES[i];
}
function classeHint(q,rev){
  const n = G.teams.length;
  if(assignable(q)){
    if(rev) return "Corregit automàticament segons l'opció de cada equip. Si cal, clica un equip per canviar-ho.";
    if(G.active===null) return `Pregunteu «Qui diu ${optLabel(q,0)}?»: clica l'opció (o tecla A-${LETTERS[q.view.length-1]}) i després els equips que la diuen (clic o tecles 1-${n}).`;
    return `Opció <b>${optLabel(q,G.active)}</b>: clica els equips que la diuen (tecles 1-${n}). Torna a clicar un equip per treure'l.`;
  }
  return rev ? `Marqueu els equips que han encertat (clic o tecles 1-${n})`
    : `Els equips diuen la seva resposta. Si voleu, clica un equip (o tecla 1-${n}) per anotar que ja ha respost.`;
}
/* Rodonetes amb el número dels equips que han triat l'opció i */
function teamDots(i){
  return `<span class="tdots">${G.teams.map((t,ti)=>G.choice?.[ti]===i?`<span class="tdot" style="background:${t.color}">${ti+1}</span>`:"").join("")}</span>`;
}
function pickOpt(i){
  if(G.phase!=="question") return;
  const q=G.qs[G.i]; if(!assignable(q) || i>=q.view.length) return;
  G.active = G.active===i ? null : i;
  renderQuestion();
}

function teamChip(t,i,rev){
  let cls="", st="";
  const q = G.qs[G.i];
  if(!rev && assignable(q)){
    if(i in G.choice){ cls="locked"; st = optLabel(q,G.choice[i]); }
    else st="⏳";
  } else if(!rev){
    if(i in G.locks){ cls="locked"; st = "🔒"; }
    else st="⏳";
  } else {
    if(G.marks[i]){ cls="ok"; st="✔ +"+pointsFor(i); }
    else { cls="ko"; st="✗"; }
  }
  return `<button class="tchip ${cls}" data-i="${i}"><span class="k">${i+1}</span><span class="dot" style="background:${t.color}"></span>${esc(t.name)} <span class="st">${st}</span></button>`;
}

function renderAnswers(q,rev){
  switch(q.t){
    case "quiz": case "intrus": case "expl": case "vf": {
      const one = q.t==="expl";
      return `<div class="tiles ${one?"one":""} ${q.t==="vf"?"vf":""}">${q.view.map((o,i)=>{
        const k = q.t==="vf" ? (i===0?1:0) : i;
        const lab = q.t==="vf" ? (i===0?"✔":"✘") : SHAPES[i];
        return `<div class="tile k${k} ${tileCls(q,i,rev)}" data-opt="${i}"><span class="shape">${lab}</span><span>${o}</span>${teamDots(i)}<span class="mark">✅</span></div>`;
      }).join("")}</div>`;
    }
    case "cadena": {
      const boxes = chainBoxes(q,rev);
      const tiles = q.view.map((o,i)=>{
        const [em,n]=ENERGY[o];
        return `<div class="tile k${i} ${tileCls(q,i,rev)}" data-opt="${i}"><span class="shape">${SHAPES[i]}</span><span>${em} Energia ${n.toLowerCase()}</span>${teamDots(i)}<span class="mark">✅</span></div>`;
      }).join("");
      return `<div class="chain">${boxes}</div><div class="tiles" style="max-height:26vh">${tiles}</div>`;
    }
    case "order": {
      if(!rev){
        return `<div class="orderList">${q.view.map((it,i)=>`<div class="oitem"><span class="badge">${LETTERS[i]}</span><span>${it}</span></div>`).join("")}</div>
          <div class="howto">Digueu l'ordre amb les lletres, per exemple: ${LETTERS.slice(0,q.items.length).split("").reverse().join(" → ")}</div>`;
      }
      return `<div class="orderList solved">${q.items.map((it,i)=>`<div class="oitem"><span class="badge step">${i+1}</span><span class="badge">${q.solution[i]}</span><span>${it}</span></div>`).join("")}</div>
        <div class="solution">Solució: ${q.solution.join(" → ")}</div>`;
    }
    case "match": {
      if(!rev){
        return `<div class="match">
          <div class="mcol">${q.pairs.map((p,i)=>`<div class="mitem"><span class="badge">${LETTERS[i]}</span><span>${p[0]}</span></div>`).join("")}</div>
          <div class="mcol">${q.right.map((r,i)=>`<div class="mitem"><span class="badge num">${i+1}</span><span>${r}</span></div>`).join("")}</div>
        </div><div class="howto">Digueu les parelles, per exemple: A2 · B4 · C1…</div>`;
      }
      return `<div class="pairs">${q.pairs.map((p,i)=>`<div class="pair">
          <div class="mitem"><span class="badge">${LETTERS[i]}</span><span>${p[0]}</span></div>
          <span class="lnk">⟷</span>
          <div class="mitem r"><span class="badge num">${q.right.indexOf(p[1])+1}</span><span>${p[1]}</span></div></div>`).join("")}</div>
        <div class="solution">Solució: ${q.solution.join(" · ")}</div>`;
    }
    case "error": {
      const html = q.segs.map(s=>{
        if(s.txt!==undefined) return esc(s.txt);
        if(rev && s.fix) return `<span class="cand bad"><sup>${s.letter}</sup><span class="w">${esc(s.w)}</span><span class="fix">${esc(s.fix)}</span></span>`;
        return `<span class="cand ${rev?"okw":""}"><sup>${s.letter}</sup><span class="w">${esc(s.w)}</span></span>`;
      }).join("");
      const opts = `<div class="tiles errOpts">${q.view.map((w,i)=>
        `<div class="tile k${i} ${tileCls(q,i,rev)}" data-opt="${i}"><span class="shape">${LETTERS[i]}</span><span>${esc(w)}</span>${teamDots(i)}<span class="mark">✅</span></div>`).join("")}</div>`;
      return `<div class="errSentence">${html}</div>
        ${rev?`<div class="solution">L'error era la ${q.correctLetter}: «${esc(q.view[q.correct])}» hauria de ser «${esc(q.segs.find(s=>s.fix).fix)}»</div>`
             :`<div class="howto">Quina paraula és l'error? Després, demaneu quina hauria de ser.</div>`}${opts}`;
    }
  }
  return "";
}
function tileCls(q,i,rev){
  if(rev) return i===q.correct ? "correct" : "dim";
  return "pick" + (G.active===i ? " active" : "");
}

function chainBoxes(q,rev){
  return q.chain.map((e,i)=>{
    const sub = q.sub?.[i] ? `<div class="es">${q.sub[i]}</div>` : "";
    if(e===null){
      if(rev){ const [em,n]=ENERGY[q.a]; return `<div class="ebox filled"><div class="em">${em}</div><div class="en">${n}</div>${sub}</div>`; }
      return `<div class="ebox blank"><div class="em">❓</div><div class="en">?</div>${q.sub?`<div class="es">&nbsp;</div>`:""}</div>`;
    }
    const [em,n]=ENERGY[e]; return `<div class="ebox"><div class="em">${em}</div><div class="en">${n}</div>${sub}</div>`;
  }).join(`<span class="carr">➜</span>`);
}

/* ---------- accions ---------- */
function teamAction(i){
  if(i>=G.teams.length) return;
  if(G.phase==="question" && assignable(G.qs[G.i])){
    if(G.active===null){ const h=document.querySelector(".hint"); if(h){ h.innerHTML="⚠️ Primer clica l'opció que han dit (o tecla A-D)."; } return; }
    if(G.choice[i]===G.active){ delete G.choice[i]; delete G.locks[i]; }
    else { G.choice[i]=G.active; if(!(i in G.locks)) G.locks[i]=remainingFrac(); }
    renderQuestion();
    if(Object.keys(G.locks).length===G.teams.length && cfg.timer!=="off") setTimeout(()=>{ if(G.phase==="question" && Object.keys(G.locks).length===G.teams.length) reveal(); },900);
  } else if(G.phase==="question"){
    if(i in G.locks) delete G.locks[i]; else G.locks[i]=remainingFrac();
    refreshChips();
    if(Object.keys(G.locks).length===G.teams.length && cfg.timer!=="off") setTimeout(()=>{ if(G.phase==="question" && Object.keys(G.locks).length===G.teams.length) reveal(); },600);
  } else if(G.phase==="reveal"){
    G.marks[i]=!G.marks[i];
    refreshChips();
  }
}
function refreshChips(){
  const rev = G.phase==="reveal";
  document.querySelector(".teamChips").innerHTML = G.teams.map((t,i)=>teamChip(t,i,rev)).join("");
  document.querySelectorAll(".tchip").forEach(b=>b.onclick=()=>teamAction(+b.dataset.i));
  fitStage();
}
function mainAction(){
  if(G.phase==="question") reveal();
  else if(G.phase==="reveal") score();
  else if(G.phase==="board") nextQuestion();
}
function togglePause(){ if(G.phase!=="question"||cfg.timer==="off") return; G.paused=!G.paused; const b=$("#btnPause"); if(b) b.textContent=G.paused?"▶":"⏸"; updateClock(); }

function reveal(){
  if(G.phase!=="question") return;
  stopTick();
  G.revealFrac = remainingFrac();
  G.phase="reveal";
  const q = G.qs[G.i];
  if(assignable(q)){          // correcció automàtica segons l'opció assignada a cada equip
    G.marks = {};
    for(const ti in G.choice) if(G.choice[ti]===q.correct) G.marks[ti]=true;
  }
  renderQuestion();
}

/* Mode projectat: cada encert val 1000. No hi ha punts per rapidesa: el professor/a
   assigna els equips quan pregunta per cada opció, i l'ordre no depèn de qui respon abans. */
function pointsFor(i){ return 1000; }

function score(){
  G.prevRank = rankOrder();
  G.delta = G.teams.map(()=>0);
  G.teams.forEach((_,i)=>{
    if(G.marks[i]){ const p=pointsFor(i); G.scores[i]+=p; G.delta[i]=p; G.streak[i]++; G.hits[i]++; }
    else G.streak[i]=0;
  });
  if(cfg.board==="each"){ G.phase="board"; renderBoard(); }
  else nextQuestion();
}
function rankOrder(){ return G.teams.map((_,i)=>i).sort((a,b)=>G.scores[b]-G.scores[a]); }

function nextQuestion(){
  G.i++;
  if(G.i>=G.qs.length) renderFinal(); else startQuestion();
}

/* ---------- classificació ---------- */
function renderBoard(){
  const order = rankOrder(), max = Math.max(1,...G.scores);
  const last = G.i===G.qs.length-1;
  $("#app").innerHTML = `
    <div class="top"><span class="mini"><span class="bolt">⚡</span> Energia en Cadena</span>
      <span class="chip">Després de la pregunta ${G.i+1} / ${G.qs.length}</span><span class="spacer"></span>
      <button class="icon-btn" id="btnFull" title="Posa o treu la pantalla completa (F)" aria-label="Pantalla completa"><span class="fsIn">⛶</span><span class="fsOut">🗗</span></button>
      <button class="icon-btn" id="btnExit" title="Sortir">✕</button></div>
    <div class="board">
      <h2>📊 Classificació</h2>
      <div class="ranks">${order.map((ti,pos)=>{
        const t=G.teams[ti], s=G.streak[ti];
        const prevPos = G.prevRank.indexOf(ti);
        const mov = prevPos>pos ? ` <span style="color:#7ff0b0;font-size:.7em">▲${prevPos-pos}</span>` : "";
        return `<div class="rank"><span class="pos">${pos+1}</span>
          <div class="barw"><div class="bar" data-w="${Math.max(4,G.scores[ti]/max*100)}" style="width:${Math.max(4,(G.scores[ti]-G.delta[ti])/max*100)}%;background:${t.color}"></div>
            <div class="lbl">${esc(t.name)}${mov}${s>=2?`<span class="streak">🔥 ${s} seguides</span>`:""}</div></div>
          <span class="pts">${G.scores[ti]}${G.delta[ti]?`<span class="delta">+${G.delta[ti]}</span>`:`<span class="delta" style="color:var(--muted)">+0</span>`}</span></div>`;
      }).join("")}</div>
      <button class="btn primary" id="btnMain">${last?"Resultats finals 🏆":"Següent pregunta ▶"}</button>
    </div>`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelectorAll(".bar").forEach(b=>b.style.width=b.dataset.w+"%")));
  $("#btnMain").onclick = mainAction;
  $("#btnFull").onclick = toggleFull;
  $("#btnExit").onclick = ()=>{ if(confirm("Vols sortir de la partida? Es perdrà la puntuació.")) renderSetup(); };
}

/* ============================================================
   MODE GRUP · un ordinador, 1-6 jugadors que responen per torns
   - Cada pregunta és d'un jugador (rotatiu). Encert: 1000 punts.
   - Si falla, rebot per al següent jugador (500 punts), excepte a
     Vertader o fals, Ordena i Relaciona.
   - Ordena i Relaciona: punts proporcionals als encerts.
   - Comodí 🤝 (1 per jugador): consultar el grup; la pregunta val 500.
   - Amb «Punts per rapidesa», el valor baixa de forma contínua des del màxim
     fins a la meitat en 1,5 × el temps del tipus de pregunta (TYPES), i després es queda a la meitat.
     No hi ha límit de temps: només canvien els punts.
   ============================================================ */
const CHOICE = ["quiz","intrus","expl","cadena","vf"];
const canRebound = q => ["quiz","intrus","expl","cadena","error"].includes(q.t);

function startGroup(){
  const P = players();
  G = {
    group:true, phase:"play", teams:P,
    qs:pickQuestions(cfg.perP*P.length), i:0,
    scores:P.map(()=>0), hits:P.map(()=>0), helps:P.map(()=>P.length>1?1:0)   // amb 1 jugador no hi ha comodí ni rebot
  };
  startGroupQ();
}
function startGroupQ(){
  G.owner = G.i % G.teams.length; G.cur = G.owner;
  G.rebound=false; G.help=false; G.done=false;
  G.wrong=new Set(); G.seq=[]; G.sel=null; G.link={}; G.log=[];
  G.t0 = performance.now();
  renderGroupQ();
  document.querySelector(".stage")?.scrollTo(0,0);
}
const basePts = () => (G.rebound||G.help) ? 500 : 1000;
/* Rapidesa: 1 just en començar el torn, baixa fins a 0,5 */
function speedFrac(){
  if(!cfg.gSpeed) return 1;
  const dur = TYPES[G.qs[G.i].t].t * 1500;
  return Math.max(0, 1-(performance.now()-G.t0)/dur);
}
const curValue = () => Math.round(basePts()*(0.5+0.5*speedFrac())/10)*10;
let gtick = setInterval(()=>{
  if(!G || !G.group || G.done || !cfg.gSpeed) return;
  const v=$("#gval"), f=$("#gfill");
  if(v) v.textContent = curValue();
  if(f) f.style.transform = `scaleX(${speedFrac()})`;
},200);
function award(frac){
  const pts = Math.round(curValue()*frac/10)*10;
  G.scores[G.cur]+=pts; if(frac===1) G.hits[G.cur]++;
  return pts;
}
/* Intent a una pregunta d'opcions o de Troba l'error */
function attempt(ok,key){
  if(G.done) return;
  const q=G.qs[G.i];
  if(ok){ G.log.push({p:G.cur,ok:true,pts:award(1)}); G.done=true; }
  else{
    G.wrong.add(key); G.log.push({p:G.cur,ok:false,pts:0});
    if(!G.rebound && G.teams.length>1 && canRebound(q)){ G.rebound=true; G.cur=(G.owner+1)%G.teams.length; G.t0=performance.now(); }
    else G.done=true;
  }
  renderGroupQ();
}
/* Comprovar Ordena / Relaciona */
function groupCheck(){
  const q=G.qs[G.i]; if(G.done) return;
  let c, tot;
  if(q.t==="order"){ tot=q.items.length; if(G.seq.length<tot) return; c=G.seq.filter((v,i)=>q.view[v]===q.items[i]).length; }
  else if(q.t==="match"){ tot=q.pairs.length; if(Object.keys(G.link).length<tot) return; c=q.pairs.filter((p,i)=>q.right[G.link[i]]===p[1]).length; }
  else return;
  G.log.push({p:G.cur,ok:c===tot,pts:award(c/tot),part:`${c}/${tot}`});
  G.done=true; renderGroupQ();
}
function groupReady(q){
  if(q.t==="order") return G.seq.length===q.items.length;
  if(q.t==="match") return Object.keys(G.link).length===q.pairs.length;
  return false;
}
function groupMain(){
  const q=G.qs[G.i];
  if(G.done){ G.i++; if(G.i>=G.qs.length) renderFinal(); else startGroupQ(); }
  else if(groupReady(q)) groupCheck();
}

function renderGroupQ(){
  const q=G.qs[G.i], ty=TYPES[q.t], ce=CENTRALS[q.c];
  const last = G.i===G.qs.length-1, D=G.done;
  const needCheck = (q.t==="order"||q.t==="match") && !D;
  const hint = D ? "Llegiu l'explicació en veu alta i passeu a la següent pregunta."
    : CHOICE.includes(q.t) ? "Toca la resposta."
    : q.t==="order" ? "Toca els passos en ordre (1, 2, 3…). Si te n'equivoques, toca'l un altre cop per treure'l."
    : q.t==="match" ? "Toca un element de l'esquerra i després la seva parella de la dreta. Per desfer-ho, toca la parella de la dreta."
    : "Toca la paraula que és un error.";
  $("#app").innerHTML = `
    <div class="top">
      <span class="mini"><span class="bolt">⚡</span> Energia en Cadena</span>
      <span class="chip">Pregunta ${G.i+1} / ${G.qs.length}</span>
      <span class="chip">${ce.e} ${ce.n==="Totes (comparar)"?"Totes les centrals":ce.n}</span>
      <span class="chip type">${ty.e} ${ty.n}</span>
      <span class="spacer"></span>
      <button class="icon-btn" id="btnSkip" title="Saltar pregunta">⏭</button>
      <button class="icon-btn" id="btnFull" title="Posa o treu la pantalla completa (F)" aria-label="Pantalla completa"><span class="fsIn">⛶</span><span class="fsOut">🗗</span></button>
      <button class="icon-btn" id="btnExit" title="Sortir">✕</button>
    </div>
    <div class="stage ${D?"revealed":""}">
      ${turnBanner()}
      <div class="qhead"><div class="qtext">${q.q}</div></div>
      <div class="answers">${groupAnswers(q)}</div>
      ${D?`<div class="revealInfo"><div class="explain">💡 ${q.exp}</div>${photoHtml(q)}</div>`:""}
    </div>
    <div class="bottom">
      <div class="teamBar">
        <div class="hint">${hint}</div>
        <div class="teamChips">${G.teams.map((t,i)=>`<div class="tchip ${i===G.cur&&!D?"now":""}"><span class="dot" style="background:${t.color}"></span>${esc(t.name)}${cfg.board==="each"?` <span class="sc">${G.scores[i]}</span>`:""}${G.helps[i]?' <span title="Comodí disponible">🤝</span>':""}</div>`).join("")}</div>
      </div>
      ${D ? `<button class="btn primary" id="btnMain">${last?"Resultats finals 🏆":"Següent pregunta ▶"}</button>`
          : needCheck ? `<button class="btn primary" id="btnMain" ${groupReady(q)?"":"disabled"}>Comprova ✓</button>` : ""}
    </div>`;

  const bm=$("#btnMain"); if(bm) bm.onclick=groupMain;
  const bh=$("#btnHelp"); if(bh) bh.onclick=()=>{ G.help=true; G.helps[G.owner]--; renderGroupQ(); };
  $("#btnSkip").onclick = ()=>{ if(confirm("Vols saltar aquesta pregunta sense puntuar?")){ G.done=true; groupMain(); } };
  $("#btnFull").onclick = toggleFull;
  $("#btnExit").onclick = ()=>{ if(confirm("Vols sortir de la partida? Es perdrà la puntuació.")) renderSetup(); };
  document.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>attempt(+b.dataset.o===q.correct, +b.dataset.o));
  document.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>attempt(b.dataset.e===q.correctLetter, b.dataset.e));
  document.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{
    const v=+b.dataset.v, k=G.seq.indexOf(v);
    if(k>=0) G.seq.splice(k,1); else G.seq.push(v);
    renderGroupQ();
  });
  document.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{ const l=+b.dataset.l; G.sel = G.sel===l ? null : l; renderGroupQ(); });
  document.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{
    const r=+b.dataset.r;
    for(const k of Object.keys(G.link)) if(G.link[k]===r) delete G.link[k];
    if(G.sel!==null){ G.link[G.sel]=r; G.sel=null; }
    renderGroupQ();
  });
  fitStage();
}

function turnBanner(){
  const P=G.teams, who=i=>`<b style="color:${P[i].color}">${esc(P[i].name)}</b>`;
  const pc = P[G.done ? G.owner : G.cur].color;
  if(G.done){
    const parts = G.log.length ? G.log.map(e=>{
      const ic = e.ok ? "✅" : (e.pts ? "🟡" : "❌");
      return `${ic} ${who(e.p)} ${e.part?e.part+" · ":""}${e.pts?"+"+e.pts+" punts":"0 punts"}`;
    }).join(" &nbsp; ") : "⏭ Pregunta saltada";
    return `<div class="turn" style="--pc:${pc}">${parts}</div>`;
  }
  const val = `<span class="pv">· val <span id="gval">${curValue()}</span> punts</span>`
    + (cfg.gSpeed ? `<span class="gbar" title="Com més ràpid, més punts"><span id="gfill" style="transform:scaleX(${speedFrac()})"></span></span>` : "");
  if(G.rebound){
    return `<div class="turn" style="--pc:${pc}">❌ ${who(G.owner)} ha fallat. ↪️ Rebot per a ${who(G.cur)} ${val}</div>`;
  }
  const helpBtn = !G.help && G.helps[G.owner]>0 ? `<button class="btn" id="btnHelp">🤝 Consulta el grup</button>` : "";
  return `<div class="turn" style="--pc:${pc}">🎯 Torn de ${who(G.cur)} ${val}
    ${G.help?`<span class="pv">· 🤝 podeu parlar en grup, però respon ${esc(P[G.cur].name)}</span>`:""}
    <span class="spacer"></span>${helpBtn}</div>`;
}

function groupAnswers(q){
  const D=G.done;
  if(CHOICE.includes(q.t)){
    const tiles = q.view.map((o,i)=>{
      let k=i, lab=SHAPES[i], txt=o;
      if(q.t==="vf"){ k=i===0?1:0; lab=i===0?"✔":"✘"; }
      if(q.t==="cadena"){ const [em,n]=ENERGY[o]; txt=`${em} Energia ${n.toLowerCase()}`; }
      const w=G.wrong.has(i);
      const cls = D ? (i===q.correct?"correct":(w?"wrong":"dim")) : (w?"wrong":"");
      return `<button class="tile k${k} ${cls}" data-o="${i}" ${D||w?"disabled":""}><span class="shape">${lab}</span><span>${txt}</span><span class="mark">${w?"❌":"✅"}</span></button>`;
    }).join("");
    const box = `<div class="tiles ${q.t==="expl"?"one":""} ${q.t==="vf"?"vf":""}" ${q.t==="cadena"?'style="max-height:26vh"':""}>${tiles}</div>`;
    return q.t==="cadena" ? `<div class="chain">${chainBoxes(q,D)}</div>${box}` : box;
  }
  if(q.t==="order"){
    if(!D) return `<div class="orderList">${q.view.map((it,i)=>{
      const k=G.seq.indexOf(i);
      return `<button class="oitem ${k>=0?"picked":""}" data-v="${i}"><span class="badge">${k>=0?k+1:"·"}</span><span>${it}</span></button>`;
    }).join("")}</div>`;
    const mine = G.seq.map(v=>q.view[v]);
    return `<div class="orderList solved">${q.items.map((it,i)=>{
      const ok = mine[i]===it;
      return `<div class="oitem ${ok?"good":"bad"}"><span class="badge step">${i+1}</span><span>${it}</span><span class="mk">${mine.length?(ok?"✔":"✗"):""}</span></div>`;
    }).join("")}</div>`;
  }
  if(q.t==="match"){
    if(!D){
      const leftOf = r => Object.keys(G.link).find(k=>G.link[k]===r);
      return `<div class="match">
        <div class="mcol">${q.pairs.map((p,i)=>{
          const r=G.link[i], lk=r!==undefined;
          return `<button class="mitem ${G.sel===i?"sel":""} ${lk?"linked":""}" data-l="${i}" ${lk?`style="--pc:${PAIR_COLORS[i]}"`:""}><span class="badge">${LETTERS[i]}</span><span>${p[0]}</span>${lk?`<span class="tag">→ ${r+1}</span>`:""}</button>`;
        }).join("")}</div>
        <div class="mcol">${q.right.map((t,r)=>{
          const l=leftOf(r), lk=l!==undefined;
          return `<button class="mitem ${lk?"linked":""}" data-r="${r}" ${lk?`style="--pc:${PAIR_COLORS[l]}"`:""}><span class="badge num">${r+1}</span><span>${t}</span>${lk?`<span class="tag">${LETTERS[l]}</span>`:""}</button>`;
        }).join("")}</div></div>`;
    }
    const any = Object.keys(G.link).length>0;
    return `<div class="pairs">${q.pairs.map((p,i)=>{
      const ok = q.right[G.link[i]]===p[1];
      return `<div class="pair ${any?(ok?"good":"bad"):""}">
        <div class="mitem"><span class="badge">${LETTERS[i]}</span><span>${p[0]}</span></div>
        <span class="lnk">⟷</span>
        <div class="mitem r"><span class="badge num">${q.right.indexOf(p[1])+1}</span><span>${p[1]}</span></div>
        <span class="mk">${any?(ok?"✔":"✗"):""}</span></div>`;
    }).join("")}</div>`;
  }
  if(q.t==="error"){
    const bad = q.segs.find(s=>s.fix);
    const html = q.segs.map(s=>{
      if(s.txt!==undefined) return esc(s.txt);
      const w=G.wrong.has(s.letter);
      if(D && s.fix) return `<span class="cand bad"><sup>${s.letter}</sup><span class="w">${esc(s.w)}</span><span class="fix">${esc(s.fix)}</span></span>`;
      if(D) return `<span class="cand okw ${w?"miss":""}"><sup>${s.letter}</sup><span class="w">${esc(s.w)}</span></span>`;
      return `<button class="cand ${w?"miss":""}" data-e="${s.letter}" ${w?"disabled":""}><sup>${s.letter}</sup><span class="w">${esc(s.w)}</span></button>`;
    }).join("");
    return `<div class="errSentence">${html}</div>
      ${D?`<div class="solution">L'error era «${esc(bad.w)}»: hauria de ser «${esc(bad.fix)}»</div>`:""}`;
  }
  return "";
}

/* ---------- final ---------- */
function renderFinal(){
  G.phase="final";
  const order = rankOrder();
  const pod = [1,0,2].filter(p=>p<order.length).map(p=>{
    const ti=order[p], t=G.teams[ti];
    return `<div class="pod p${p+1}"><div class="name" style="color:${t.color}">${esc(t.name)}</div>
      <div class="pp">${G.scores[ti]} punts · ${G.group ? G.hits[ti]+" encerts" : G.hits[ti]+"/"+G.qs.length+" encerts"}</div>
      <div class="blk">${["🥇","🥈","🥉"][p]}</div></div>`;
  }).join("");
  const rest = order.slice(3).map((ti,k)=>`${k+4}. ${esc(G.teams[ti].name)} · ${G.scores[ti]} punts`).join(" &nbsp;·&nbsp; ");
  $("#app").innerHTML = `
    <div class="top"><span class="mini"><span class="bolt">⚡</span> Energia en Cadena</span><span class="spacer"></span>
      <button class="icon-btn" id="btnFull" title="Posa o treu la pantalla completa (F)" aria-label="Pantalla completa"><span class="fsIn">⛶</span><span class="fsOut">🗗</span></button></div>
    <div class="board">
      <h2>🏆 Resultats finals</h2>
      <div class="sub">${G.qs.length} preguntes sobre les centrals elèctriques</div>
      <div class="podium">${pod}</div>
      ${rest?`<div class="rest">${rest}</div>`:""}
      <div class="finalBtns">
        <button class="btn primary" id="btnAgain">Nova partida ↻</button>
        <button class="btn" id="btnSetup">Canviar configuració</button>
      </div>
    </div>`;
  $("#btnAgain").onclick = G.group ? startGroup : startGame;
  $("#btnSetup").onclick = renderSetup;
  $("#btnFull").onclick = toggleFull;
}

/* ============================================================
   ZONA D'ESTUDI (v1.1.0) · per estudiar sol, sense punts, trofeus ni perfils
   - 📖 Teoria: fitxa de cada central (i l'esquema comú)

   Mateix contingut que el joc: sense ubicacions a Catalunya, rendiments,
   tipus de turbines ni apartats «Tipus de…». Font: UD1_Teoria_Centrals i UD1_Centrals_electriques.
   ============================================================ */

    const [em,n]=ENERGY[e];
    const box = `<div class="ebox"><div class="em">${em}</div><div class="en">${n}</div><div class="es">${t.sub[i]}</div></div>`;
    if(i===0) return box;
    return `<div class="via"><span class="carr">➜</span>${withVia?`<span class="vl">${t.via[i-1]}</span>`:""}</div>${box}`;
  }).join("")}</div>`;
}

  const nav = `<nav class="tNav">${["general",...STUDY_ORDER].map(c=>`<button data-c="${c}" class="${c===k?"on":""}">${cEmoji(c)} ${cName(c)}</button>`).join("")}</nav>`;

      <section><h3>El camí de l'energia</h3>
        <div class="flow">${T.esquema.map(([a,b],i)=>`${i?'<span class="carr">➜</span>':""}<div class="fstep"><b>${a}</b><span>${b}</span></div>`).join("")}</div></section>
      <section><h3>Què fa girar la turbina?</h3>

        <tbody>${STUDY_ORDER.map(c=>{const t=THEORY[c];return `<tr><td>${cEmoji(c)} ${cName(c)}</td><td>${t.font}</td><td>${t.renov?"✅ Sí":"❌ No"}</td><td>${chainText(t)}</td><td>${t.co2}</td></tr>`;}).join("")}</tbody></table></div></section>
      <section><h3>Conceptes clau</h3>
        <ul class="kv">${T.conceptes.map(([a,b])=>`<li><b>${a}</b><span>${b}</span></li>`).join("")}</ul></section>

      <h2>${cEmoji(k)} ${t.name}</h2>
      <div class="tags"><span class="chip">Font: ${t.font}</span><span class="chip">${t.renov?"✅ Renovable":"❌ No renovable"}</span><span class="chip">${t.co2}</span></div>
      <section class="tQue"><div><h3>Què és?</h3><p>${t.que}</p></div>
        ${p?`<figure class="photo tPhoto" style="margin:0"><img src="${p.src}" alt="${esc(p.alt)}" onerror="this.closest('figure').remove()"><figcaption>${p.cap}<small>${p.credit}</small></figcaption></figure>`:""}</section>
      <section><h3>Transformació d'energies</h3>${chainHtml(t)}<p class="read">📖 <b>Com ho llegim:</b> ${t.llegir}</p></section>
      <section><h3>Com funciona? Pas a pas</h3><ol class="steps">${t.passos.map(s=>`<li>${s}</li>`).join("")}</ol></section>
      <section><h3>Components</h3><ul class="kv">${t.comps.map(([a,b])=>`<li><b>${a}</b><span>${b}</span></li>`).join("")}</ul></section>
      <section class="pc"><div class="pro"><h3>👍 Avantatges</h3><ul>${t.avant.map(s=>`<li>${s}</li>`).join("")}</ul></div>
        <div class="con"><h3>👎 Inconvenients</h3><ul>${t.inconv.map(s=>`<li>${s}</li>`).join("")}</ul></div></section>
      <section><h3>🌍 Impacte ambiental</h3><ul class="kv">${t.impacte.map(([a,b])=>`<li><b>${a}</b><span>${b}</span></li>`).join("")}</ul>

  $("#app").innerHTML = studyTop("📖 Teoria","home") + `<div class="studyWrap tWrap">${nav}<div class="tMain">${body}</div></div>`;

function theoryLinks(k){
  return `<div class="tLinks"><span>Ara posa-ho a prova:</span>
    <button class="btn" data-go="cards:${k}">🃏 Targetes${k==="general"?" de comparar":" d'aquesta central"}</button>
    <button class="btn" data-go="practice:${k}">✏️ Practica${k==="general"?" comparant":" aquesta central"}</button>
    ${k!=="general"?`<button class="btn" data-go="chain:${k}">⛓️ Construeix la cadena</button>`:""}</div>`;
}

/* ---------- 🃏 TARGETES ---------- */
function buildCards(filter){
  const cards = [];
  const add = (c,f,b)=>cards.push({c,f,b});
  if(filter==="all"||filter==="general"){
    const T=THEORY_GENERAL;
    add("general","Quin és l'esquema comú de les centrals amb turbina?",T.esquema.map(x=>x[0]).join(" → "));
    add("general","Quina central NO té turbina? Com produeix l'electricitat?","La <b>fotovoltaica</b>: les cèl·lules de silici transformen la llum directament en electricitat.");
    add("general","Què fa girar la turbina a la nuclear, la tèrmica i la termosolar?","El <b>vapor d'aigua</b>. Només canvia com s'aconsegueix la calor: fissió, combustió o Sol.");
    T.conceptes.forEach(([a,b])=>add("general",`Concepte: <b>${a}</b>`,b));
    add("general","Quines de les sis centrals NO són renovables?","La <b>tèrmica</b> (combustibles fòssils) i la <b>nuclear</b> (l'urani és limitat).");
    add("general","Quina de les sis centrals emet CO₂ quan funciona?","La <b>tèrmica</b>, perquè crema un combustible.");
  }
  for(const k of STUDY_ORDER){
    if(filter!=="all" && filter!==k) continue;
    const t=THEORY[k], n=cName(k);
    add(k,`Què és una <b>${n.toLowerCase()}</b>?`,t.que);
    add(k,`Cadena d'energia: <b>${n}</b>`,`${chainText(t)}<br><small>${t.via.map((v,i)=>`${eName(t.chain[i])} → ${eName(t.chain[i+1])}: <b>${v}</b>`).join(" · ")}</small>`);
    add(k,`<b>${n}</b>: quina és la font d'energia? És renovable?`,`${t.font}. ${t.renov?"Sí, és renovable":"No és renovable"}. ${t.co2}.`);
    t.comps.forEach(([a,b])=>add(k,`${cEmoji(k)} Quina funció té: <b>${a}</b>?`,b));
    add(k,`${cEmoji(k)} Digues tres <b>avantatges</b> de la ${n.toLowerCase()}.`,"<ul>"+t.avant.slice(0,4).map(s=>`<li>${s}</li>`).join("")+"</ul>");
    add(k,`${cEmoji(k)} Digues tres <b>inconvenients</b> de la ${n.toLowerCase()}.`,"<ul>"+t.inconv.slice(0,4).map(s=>`<li>${s}</li>`).join("")+"</ul>");
    t.impacte.forEach(([a,b])=>add(k,`${cEmoji(k)} Impacte ambiental: <b>${a}</b>. Què vol dir?`,b));
    add(k,`${cEmoji(k)} Quines mesures redueixen l'impacte de la ${n.toLowerCase()}?`,t.mesura);
  }
  return shuffle(cards);
}
function startCards(filter){
  S = {view:"cards", filter, deck:buildCards(filter), flipped:false, known:0, again:0};
  S.total = S.deck.length;
  renderCards();
}
function flipCard(){     // gira la targeta amb animació (sense tornar a dibuixar la pantalla)
  S.flipped = !S.flipped;
  $("#fcard")?.classList.toggle("flipped", S.flipped);
  $(".cBtns")?.classList.toggle("hiddenV", !S.flipped);
}
function cardAnswer(knew){
  if(!S.flipped) return;
  const card = S.deck.shift();
  if(knew) S.known++;
  else { S.again++; S.deck.splice(Math.min(3,S.deck.length),0,card); }   // torna a sortir d'aquí a 3 targetes
  S.flipped=false; renderCards();
}
function renderCards(){
  const card = S.deck[0];
  let main;
  if(!card){
    main = `<div class="sDone"><h2>✔ Has repassat totes les targetes</h2>
      <p>${S.total} targetes${S.again?` · ${S.again} vegades has dit «Encara no»: és normal, és així com s'aprèn.`:""}</p>
      <div class="row" style="justify-content:center"><button class="btn primary" id="btnAgainC">Torna a començar ↻</button>
      <button class="btn" id="btnTheoryC">📖 Repassar la teoria</button></div></div>`;
  } else {
    main = `<div class="cardArea">
      <div class="prog"><div class="pbar"><span style="width:${S.known/S.total*100}%"></span></div><span>${S.known} / ${S.total} sabudes</span></div>
      <button class="fcard ${S.flipped?"flipped":""}" id="fcard" aria-label="Gira la targeta">
        <div class="fside front"><span class="ftag">${cEmoji(card.c)} ${cName(card.c)}</span><div class="ftxt">${card.f}</div><span class="fhint">Pensa la resposta i toca per girar-la (o prem Espai)</span></div>
        <div class="fside back"><span class="ftag">Resposta</span><div class="ftxt">${card.b}</div></div>
      </button>
      <div class="cBtns ${S.flipped?"":"hiddenV"}">
        <button class="btn cNo" id="btnNo">🔁 Encara no <small>(←)</small></button>
        <button class="btn cYes" id="btnYes">✔ Ja ho sé <small>(→)</small></button>
      </div></div>`;
  }
  $("#app").innerHTML = studyTop("🃏 Targetes","home") + `<div class="studyWrap">${centralChips(S.filter,true,true)}${main}</div>`;
  bindBack("home");
  document.querySelectorAll(".sFilter button").forEach(b=>b.onclick=()=>startCards(b.dataset.c));
  if(card){
    $("#fcard").onclick = flipCard;
    $("#btnNo").onclick = ()=>cardAnswer(false);
    $("#btnYes").onclick = ()=>cardAnswer(true);
  } else {
    $("#btnAgainC").onclick = ()=>startCards(S.filter);
    $("#btnTheoryC").onclick = ()=>renderTheory(S.filter==="all"?"general":S.filter);
  }
}

/* ---------- ✏️ PRACTICA SOL ----------
   Fa servir groupAnswers() del mode grup (respostes clicables). G conté l'estat de la pregunta. */
function startPractice(filter){
  const pool = filter==="all" ? BANC : BANC.filter(q=>q.c===filter);
  S = {view:"practice", filter, first:0, fails:new Set()};
  const savedMode = cfg.mode; cfg.mode = "mix";                 // la tria equilibrada fa servir tot el banc
  const qs = filter==="all" ? pickQuestions(15) : shuffle(pool).map(prep);
  cfg.mode = savedMode;
  S.total = qs.length;
  G = {study:true, qs, i:0};
  newPracticeQ();
}
function newPracticeQ(){
  Object.assign(G,{done:false, ok:false, wrong:new Set(), seq:[], sel:null, link:{}});
  renderPractice();
}
function practiceResult(ok){
  if(G.done) return;
  const q=G.qs[G.i];
  G.done=true; G.ok=ok;
  if(ok && !q.again) S.first++;
  if(!ok){ S.fails.add(q.c); G.qs.push({...prep(q), again:true}); }  // torna a sortir al final
  renderPractice();
}
function practiceNext(){
  if(!G.done){ const q=G.qs[G.i]; if((q.t==="order"&&G.seq.length===q.items.length)||(q.t==="match"&&Object.keys(G.link).length===q.pairs.length)) practiceCheck(); return; }
  G.i++;
  if(G.i>=G.qs.length) renderPracticeEnd(); else newPracticeQ();
}
function practiceCheck(){
  const q=G.qs[G.i];
  if(q.t==="order") practiceResult(G.seq.every((v,i)=>q.view[v]===q.items[i]));
  else if(q.t==="match") practiceResult(q.pairs.every((p,i)=>q.right[G.link[i]]===p[1]));
}
function renderPractice(){
  const q=G.qs[G.i], ty=TYPES[q.t], ce=CENTRALS[q.c], D=G.done;
  const left = G.qs.length - G.i;
  const needCheck = (q.t==="order"||q.t==="match") && !D;
  const ready = (q.t==="order"&&G.seq.length===q.items.length)||(q.t==="match"&&Object.keys(G.link).length===q.pairs.length);
  const hint = D ? "" : CHOICE.includes(q.t) ? "Toca la resposta."
    : q.t==="order" ? "Toca els passos en ordre (1, 2, 3…). Toca'n un altre cop per treure'l."
    : q.t==="match" ? "Toca un element de l'esquerra i després la seva parella de la dreta."
    : "Toca la paraula que és un error.";
  const fb = !D ? "" : G.ok
    ? `<div class="turn" style="--pc:var(--ok)">✅ <b>Correcte!</b></div>`
    : `<div class="turn" style="--pc:var(--ko)">❌ <b>No és correcte.</b> <span class="pv">Llegeix l'explicació: aquesta pregunta tornarà a sortir al final.</span></div>`;
  $("#app").innerHTML = studyTop("✏️ Practica sol","home") + `
    <div class="stage ${D?"revealed":""}">
      ${centralChips(S.filter,true,true)}
      ${fb}
      <div class="qhead"><div class="qtext">${q.again?'<span class="chip" style="font-size:.5em;vertical-align:middle">🔁 Repàs</span> ':""}${q.q}</div></div>
      <div class="answers">${groupAnswers(q)}</div>
      ${D?`<div class="revealInfo"><div class="explain">💡 ${q.exp}</div>${photoHtml(q)}</div>`:""}
    </div>
    <div class="bottom">
      <div class="teamBar"><div class="hint">${ce.e} ${ce.n==="Totes (comparar)"?"Totes les centrals":ce.n} · ${ty.e} ${ty.n}${hint?" · "+hint:""}</div>
        <div class="hint">Queden ${left} pregunta${left===1?"":"s"} · encertades a la primera: ${S.first}</div></div>
      ${D ? `<button class="btn primary" id="btnMain">${G.i===G.qs.length-1?"Acabar ✔":"Següent ▶"}</button>`
          : needCheck ? `<button class="btn primary" id="btnMain" ${ready?"":"disabled"}>Comprova ✓</button>` : ""}
    </div>`;
  bindBack("home");
  document.querySelectorAll(".sFilter button").forEach(b=>b.onclick=()=>startPractice(b.dataset.c));
  const bm=$("#btnMain"); if(bm) bm.onclick = ()=> D ? practiceNext() : practiceCheck();
  document.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{ const o=+b.dataset.o; if(o!==q.correct) G.wrong.add(o); practiceResult(o===q.correct); });
  document.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>{ const e=b.dataset.e; if(e!==q.correctLetter) G.wrong.add(e); practiceResult(e===q.correctLetter); });
  document.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{ const v=+b.dataset.v, k=G.seq.indexOf(v); if(k>=0) G.seq.splice(k,1); else G.seq.push(v); renderPractice(); });
  document.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{ const l=+b.dataset.l; G.sel = G.sel===l ? null : l; renderPractice(); });
  document.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{
    const r=+b.dataset.r;
    for(const k of Object.keys(G.link)) if(G.link[k]===r) delete G.link[k];
    if(G.sel!==null){ G.link[G.sel]=r; G.sel=null; }
    renderPractice();
  });
  fitStage();
}
function renderPracticeEnd(){
  const fails=[...S.fails];
  $("#app").innerHTML = studyTop("✏️ Practica sol","home") + `<div class="studyWrap"><div class="sDone">
    <h2>✔ Has acabat la pràctica</h2>
    <p>Has encertat a la primera <b>${S.first}</b> de ${S.total} preguntes, i al final les has resolt totes.</p>
    ${fails.length?`<p>Et convé repassar la teoria de:</p><div class="row" style="justify-content:center">${fails.map(c=>`<button class="btn" data-th="${c}">📖 ${cEmoji(c)} ${cName(c)}</button>`).join("")}</div>`
      :`<p>No has fallat cap pregunta. Molt bé!</p>`}
    <div class="row" style="justify-content:center;margin-top:1em"><button class="btn primary" id="btnAgainP">Practica més ↻</button></div>
  </div></div>`;
  G = null;
  bindBack("home");
  document.querySelectorAll("[data-th]").forEach(b=>b.onclick=()=>renderTheory(b.dataset.th));
  $("#btnAgainP").onclick = ()=>startPractice(S.filter);
}

/* ---------- ⛓️ CONSTRUEIX LA CADENA ---------- */
function startChain(idx){
  const k = STUDY_ORDER[idx], t = THEORY[k];
  const extraE = shuffle(Object.keys(ENERGY).filter(e=>!t.chain.includes(e))).slice(0, Math.max(2, 6-t.chain.length));
  const extraD = shuffle(DEVICES.filter(d=>!t.via.includes(d))).slice(0, Math.max(3, 6-t.via.length));
  S = {view:"chain", idx, k, e:Array(t.chain.length).fill(null), d:Array(t.via.length).fill(null),
       optE:shuffle([...new Set(t.chain), ...extraE]), optD:shuffle([...new Set(t.via), ...extraD]), checked:false, tries:0};
  renderChain();
}
function chainPhase(){ return S.e.includes(null) ? "e" : "d"; }
function chainSolved(){ const t=THEORY[S.k]; return S.e.every((x,i)=>x===t.chain[i]) && S.d.every((x,i)=>x===t.via[i]); }
function renderChain(){
  const t=THEORY[S.k], ph=chainPhase(), full=!S.e.includes(null)&&!S.d.includes(null);
  const solved = S.checked && chainSolved();
  const slotE = i => {
    const v=S.e[i]; const st = S.checked ? (v===t.chain[i]?"good":"bad") : "";
    if(!v) return `<button class="ebox slot blank" data-se="${i}"><div class="em">❓</div><div class="en">${i+1}</div></button>`;
    const [em,n]=ENERGY[v];
    return `<button class="ebox slot ${st}" data-se="${i}"><div class="em">${em}</div><div class="en">${n}</div>${solved?`<div class="es">${t.sub[i]}</div>`:""}</button>`;
  };
  const slotD = i => {
    const v=S.d[i]; const st = S.checked ? (v===t.via[i]?"good":"bad") : "";
    return `<div class="via"><span class="carr">➜</span><button class="dslot ${v?"":"empty"} ${st}" data-sd="${i}">${v||"?"}</button></div>`;
  };
  const slots = `<div class="chain sChain build">${t.chain.map((_,i)=>(i?slotD(i-1):"")+slotE(i)).join("")}</div>`;
  const opts = solved ? "" : ph==="e"
    ? `<p class="howto">1️⃣ Toca les <b>energies</b> en ordre, de la primera a l'última. ${t.chain.length} caselles.</p>
       <div class="optGrid">${S.optE.map(e=>{const [em,n]=ENERGY[e]; const used=S.e.includes(e); return `<button class="opt ${used?"used":""}" data-oe="${e}" ${used?"disabled":""}>${em} ${n}</button>`;}).join("")}</div>`
    : `<p class="howto">2️⃣ Ara toca <b>on passa</b> cada transformació (les fletxes), d'esquerra a dreta.</p>
       <div class="optGrid">${S.optD.map(d=>{const used=S.d.includes(d)&&t.via.filter(x=>x===d).length<=S.d.filter(x=>x===d).length; return `<button class="opt dev ${used?"used":""}" data-od="${esc(d)}" ${used?"disabled":""}>${d}</button>`;}).join("")}</div>`;
  const msg = !S.checked ? "" : solved
    ? `<div class="turn" style="--pc:var(--ok)">✅ <b>Perfecte!</b> <span class="pv">${t.llegir}</span></div>`
    : `<div class="turn" style="--pc:var(--ko)">❌ Hi ha caselles en vermell. Toca-les per treure-les i torna-ho a provar.</div>`;
  $("#app").innerHTML = studyTop("⛓️ Construeix la cadena","home") + `
    <div class="studyWrap">
      <div class="toggles sFilter">${STUDY_ORDER.map((c,i)=>`<button data-ci="${i}" class="${i===S.idx?"on":""}">${cEmoji(c)} ${cName(c)}</button>`).join("")}</div>
      <h2 class="chTitle">${cEmoji(S.k)} ${t.name}</h2>
      ${msg}
      ${slots}
      ${opts}
      <div class="row chBtns">
        ${solved ? `<button class="btn" data-th="${S.k}">📖 Veure la teoria</button>
                    <button class="btn primary" id="btnNextC">${S.idx<STUDY_ORDER.length-1?"Següent central ▶":"Tornar a començar ↻"}</button>`
                 : `<button class="btn" id="btnReset">Esborra-ho tot</button>
                    <button class="btn primary" id="btnCheck" ${full?"":"disabled"}>Comprova ✓</button>`}
      </div>
    </div>`;
  bindBack("home");
  document.querySelectorAll("[data-ci]").forEach(b=>b.onclick=()=>startChain(+b.dataset.ci));
  document.querySelectorAll("[data-oe]").forEach(b=>b.onclick=()=>{ const i=S.e.indexOf(null); if(i>=0){ S.e[i]=b.dataset.oe; S.checked=false; renderChain(); } });
  document.querySelectorAll("[data-od]").forEach(b=>b.onclick=()=>{ const i=S.d.indexOf(null); if(i>=0){ S.d[i]=b.dataset.od; S.checked=false; renderChain(); } });
  if(!solved){
    document.querySelectorAll("[data-se]").forEach(b=>b.onclick=()=>{ S.e[+b.dataset.se]=null; S.checked=false; renderChain(); });
    document.querySelectorAll("[data-sd]").forEach(b=>b.onclick=()=>{ S.d[+b.dataset.sd]=null; S.checked=false; renderChain(); });
  }
  const bc=$("#btnCheck"); if(bc) bc.onclick=()=>{ S.checked=true; S.tries++; renderChain(); };
  const br=$("#btnReset"); if(br) br.onclick=()=>startChain(S.idx);
  const bn=$("#btnNextC"); if(bn) bn.onclick=()=>startChain((S.idx+1)%STUDY_ORDER.length);
  document.querySelectorAll("[data-th]").forEach(b=>b.onclick=()=>renderTheory(b.dataset.th));
}

/* ---------- teclat de la Zona d'estudi ---------- */
function studyKey(e){
  if(e.key==="Escape"){ S.view==="home" ? renderSetup() : renderStudyHome(); return; }
  if(e.key==="f"||e.key==="F"){ toggleFull(); return; }
  if(S.view==="cards" && S.deck?.length){
    if(e.key===" "||e.key==="Enter"){ e.preventDefault(); flipCard(); }
    else if(e.key==="ArrowLeft") cardAnswer(false);
    else if(e.key==="ArrowRight") cardAnswer(true);
  } else if(S.view==="practice" && G?.study){
    if(e.key==="Enter"||e.key==="ArrowRight"){ e.preventDefault(); practiceNext(); }
  }
}

function toggleFull(){
  if(!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(()=>{});
  else document.exitFullscreen?.();
}

/* ---------- teclat ---------- */
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT") return;
  const cred=document.querySelector(".credBg"); if(cred){ if(e.key==="Escape") cred.remove(); return; }
  if(S){ studyKey(e); return; }
  if(!G || G.phase==="final"){ if(e.key==="f"||e.key==="F") toggleFull(); return; }
  if(G.group){
    if(e.key==="Enter"||e.key==="ArrowRight"){ e.preventDefault(); groupMain(); }
    else if(e.key==="f"||e.key==="F") toggleFull();
    return;
  }
  if(e.key===" "||e.key==="Enter"||e.key==="ArrowRight"){ e.preventDefault(); mainAction(); }
  else if(/^[1-6]$/.test(e.key)) teamAction(+e.key-1);
  else if(/^[a-dA-D]$/.test(e.key)) pickOpt("abcd".indexOf(e.key.toLowerCase()));
  else if(e.key==="p"||e.key==="P") togglePause();
  else if(e.key==="f"||e.key==="F") toggleFull();
});

renderSetup();
</script>
</body>
